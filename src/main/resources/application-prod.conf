# ==================== 服务器基础配置 ====================
server {
  port = 8080                    # 服务监听端口
  name = "pig-security"          # 服务名称
}

# ==================== 管理员账户配置 ====================
admin {
  username = "root"             # 管理员登录用户名
  password = "root"             # 管理员登录密码
}

# ==================== 认证授权配置 ====================
auth {
  issuer = ${server.name}       # JWT签发者标识，使用服务名称
  access.expiresIn = 1800       # 访问令牌有效期（秒），30分钟
  refresh.expiresIn = 604800    # 刷新令牌有效期（秒），7天
  client.expiresIn = 604800     # 客户端凭证有效期（秒），7天
}

# ==================== AES加密配置 ====================
aes {
  secretKey = ${server.name}    # AES加密密钥
  salt = ${server.name}         # 加密盐值
  iterate = 65536               # PBKDF2 迭代次数
  keyLength = 32                # 派生密钥长度（字节），对应 AES-256
}

# ==================== CORS跨域配置 ====================
pekko.http.cors {
  allowed-origins = [           # 允许跨域访问的来源列表
    "http://localhost:5173",
  ]
  allowed-methods = ["GET", "POST", "PUT", "DELETE"]  # 允许的HTTP方法
  allowed-headers = ["Authorization", "Content-Type"] # 允许的请求头
  allow-credentials = true      # 是否允许携带凭证（Cookie/Authorization）
  max-age = 3600                # 预检请求缓存时间（秒）
}

# ==================== Redis缓存配置 ====================
redis {
  host = "127.0.0.1"                 # Redis服务器地址
  port = 6379                        # Redis服务器端口
  password = "your_redis_password"   # Redis连接密码
  keyPrefix = ${server.name}         # Redis键前缀
  database = 1                       # 使用的Redis数据库索引（0-15）
  maxTotal = 10                      # 连接池最大连接数
  maxIdle = 5                        # 连接池最大空闲连接数
  minIdle = 1                        # 连接池最小空闲连接数
  evictorShutdownTimeout = 2000      # 驱逐线程关闭超时时间（毫秒）
  testOnBorrow = true                # 借用连接时是否测试有效性
  testOnReturn = false               # 归还连接时是否测试有效性
  testWhileIdle = true               # 空闲时是否测试连接有效性
  timeoutMillis = 2000               # 获取连接的超时时间（毫秒）
  connectionTimeoutMillis = 2000     # 建立连接的超时时间（毫秒）
  socketTimeoutMillis = 2000         # Socket读写超时时间（毫秒）
  blockingSocketTimeoutMillis = 2000 # 阻塞Socket超时时间（毫秒）
  clearnOnStart = false              # 启动时是否清空Redis数据
}

# ==================== 数据库连接池配置 ====================
hikari {
  jdbcUrl = "jdbc:mysql://127.0.0.1:3306/feed?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&useUnicode=true" # 数据库连接URL
  username = "your_username"         # 数据库用户名
  password = "your_password"         # 数据库密码
  maximumPoolSize = 50               # 连接池最大连接数
  minimumIdle = 20                   # 连接池最小空闲连接数
  idleTimeout = 10000                # 连接空闲超时时间（毫秒）
  maxLifetime = 1800000              # 连接最大存活时间（毫秒），30分钟
  migrateOnStart = true              # 启动时是否自动执行数据库迁移
}